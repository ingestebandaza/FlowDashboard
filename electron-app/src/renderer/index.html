<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* wss://localhost:* ws://127.0.0.1:* wss://127.0.0.1:*; img-src 'self' data: blob:; worker-src 'self' blob:;">
  <title>FlowDashboard Pro</title>
  <link rel="stylesheet" href="styles.css">
  <!-- SignalR Client -->
  <script src="../../node_modules/@microsoft/signalr/dist/browser/signalr.min.js"></script>
</head>
<body>
  <div id="app">
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--muted);">
      Cargando FlowDashboard Pro...
    </div>
  </div>
  <!-- Scripts principales -->
  <script>
    // Capturar errores globales
    window.addEventListener('error', (event) => {
      console.error('❌ Error global:', event.error);
    });
    
    window.addEventListener('unhandledrejection', (event) => {
      console.error('❌ Promise rechazada:', event.reason);
    });
    
    console.log('✅ Scripts de error global cargados');
  </script>
  <script src="api-client.js"></script>
  <script src="stream-renderer.js"></script>
  <!-- Etapa C: cliente WebCodecs H.264 para focus mode (bypass FLAG_SECURE) -->
  <script src="stream-renderer-h264.js"></script>
  <script src="flow-touch.js"></script>
  <script src="inspector.js"></script>
  <script src="test-connections.js"></script>
  <script src="app.js"></script>
</body>
</html>
